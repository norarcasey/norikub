  <!-- Norikub's mark (KUB-39): Nora, as the joker, filling a cream tile. The tile is the whole
       icon, with only a thin edge and its shadow at the bottom; there is no felt behind it.
       The face is NoraJoker from src/table/art.tsx, copied here because the icons are generated
       from this one file at build time; redraw it here when the joker changes. No lettering:
       glyphs rasterise differently on machines with different fonts. -->
